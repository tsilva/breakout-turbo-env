[package]
name = "env-breakoutatari2600-turbo-native"
version = "0.5.7"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Deterministic high-throughput Breakout vector environment"
homepage = "https://github.com/tsilva/env-BreakoutAtari2600-turbo-native"
repository = "https://github.com/tsilva/env-BreakoutAtari2600-turbo-native"
readme = "README.md"

[lib]
name = "_env_breakoutatari2600_turbo_native"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["abi3-py311"] }
rayon = "1.10.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
